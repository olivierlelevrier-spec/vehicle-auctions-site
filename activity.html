<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Activité - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; padding: 20px; }
        .header { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { font-size: 2rem; }
        .btn { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; }
        .btn:hover { background: #2563eb; }
        .container { max-width: 1000px; margin: 0 auto; }
        .timeline { position: relative; padding: 20px 0; }
        .timeline::before { content: ''; position: absolute; left: 30px; top: 0; bottom: 0; width: 2px; background: rgba(59, 130, 246, 0.3); }
        .activity-item { background: rgba(30, 41, 59, 0.8); border-radius: 8px; padding: 20px; margin-bottom: 20px; margin-left: 80px; position: relative; border-left: 4px solid #3b82f6; }
        .activity-item.create { border-left-color: #22c55e; }
        .activity-item.bid { border-left-color: #f59e0b; }
        .activity-item.favorite { border-left-color: #ec4899; }
        .activity-icon { position: absolute; left: 0; top: 20px; width: 60px; height: 60px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; border: 4px solid #1e293b; }
        .activity-item.create .activity-icon { background: #22c55e; }
        .activity-item.bid .activity-icon { background: #f59e0b; }
        .activity-item.favorite .activity-icon { background: #ec4899; }
        .activity-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 5px; }
        .activity-description { color: #94a3b8; font-size: 0.9rem; margin-bottom: 10px; }
        .activity-time { color: #64748b; font-size: 0.85rem; }
        .empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Mon Activité</h1>
        <a href="browse.html" class="btn">← Retour</a>
    </div>
    <div class="container">
        <div class="timeline" id="timeline"></div>
        <div id="empty" class="empty" style="display:none"><p>Aucune activité pour le moment</p></div>
    </div>
    <script>
        function init() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) { window.location.href = 'login.html'; return; }
            const activities = [];
            const listings = JSON.parse(localStorage.getItem('myListings_' + currentUser.email) || '[]');
            const bids = JSON.parse(localStorage.getItem('bids_' + currentUser.email) || '[]');
            const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            const notifs = JSON.parse(localStorage.getItem('notifications_' + currentUser.email) || '[]');
            listings.forEach(l => { activities.push({ type: 'create', title: 'Annonce créée', description: l.title, time: l.createdAt, icon: '📋' }); });
            bids.forEach(b => { activities.push({ type: 'bid', title: 'Enchère placée', description: b.car + ' - €' + b.amount, time: b.date, icon: '🏆' }); });
            favorites.forEach(f => { activities.push({ type: 'favorite', title: 'Véhicule ajouté aux favoris', description: 'ID: ' + f, time: new Date().toISOString(), icon: '❤️' }); });
            notifs.forEach(n => { activities.push({ type: 'notif', title: n.title, description: n.message, time: n.time, icon: '🔔' }); });
            activities.sort((a, b) => new Date(b.time) - new Date(a.time));
            if (activities.length === 0) { document.getElementById('empty').style.display = 'block'; return; }
            const html = activities.map(a => {
                const time = new Date(a.time).toLocaleDateString('fr-FR', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                return `<div class="activity-item ${a.type}"><div class="activity-icon">${a.icon}</div><div class="activity-title">${a.title}</div><div class="activity-description">${a.description}</div><div class="activity-time">${time}</div></div>`;
            }).join('');
            document.getElementById('timeline').innerHTML = html;
        }
        init();
    </script>
</body>
</html>
