<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; padding: 20px; }
        .header { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { font-size: 2rem; }
        .btn { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; }
        .btn:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .container { max-width: 1200px; margin: 0 auto; }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid rgba(71, 85, 105, 0.3); }
        .tab { padding: 12px 20px; background: none; color: #94a3b8; border: none; cursor: pointer; font-size: 1rem; font-weight: 600; }
        .tab.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; margin-bottom: -2px; }
        .content { display: none; }
        .content.active { display: block; }
        table { width: 100%; border-collapse: collapse; background: rgba(30, 41, 59, 0.8); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(71, 85, 105, 0.3); }
        th { background: rgba(59, 130, 246, 0.2); font-weight: 600; }
        tr:hover { background: rgba(59, 130, 246, 0.1); }
        .stat { background: rgba(30, 41, 59, 0.8); border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: #3b82f6; }
        .stat-label { color: #94a3b8; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍💼 Admin Panel</h1>
        <a href="browse.html" class="btn">← Retour</a>
    </div>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('stats')">Statistiques</button>
            <button class="tab" onclick="switchTab('users')">Utilisateurs</button>
            <button class="tab" onclick="switchTab('listings')">Annonces</button>
        </div>
        <div id="stats" class="content active">
            <div class="stat">
                <div class="stat-label">Total Utilisateurs</div>
                <div class="stat-value" id="userCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Annonces Créées</div>
                <div class="stat-value" id="listingCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Enchères Placées</div>
                <div class="stat-value" id="bidCount">0</div>
            </div>
        </div>
        <div id="users" class="content">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Date d'inscription</th>
                        <th>Annonces</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersList"></tbody>
            </table>
        </div>
        <div id="listings" class="content">
            <table>
                <thead>
                    <tr>
                        <th>Titre</th>
                        <th>Créateur</th>
                        <th>Prix</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="listingsList"></tbody>
            </table>
        </div>
    </div>
    <script>
        function switchTab(tab) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelectorAll('.content').forEach(c => c.classList.remove('active')); event.target.classList.add('active'); document.getElementById(tab).classList.add('active'); }
        function init() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser || currentUser.email !== 'admin@vehicleauctions.fr') { alert('Accès administrateur uniquement'); window.location.href = 'browse.html'; return; }
            loadStats();
            loadUsers();
            loadListings();
        }
        function loadStats() {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            let totalListings = 0, totalBids = 0;
            users.forEach(u => { totalListings += JSON.parse(localStorage.getItem('myListings_' + u.email) || '[]').length; totalBids += JSON.parse(localStorage.getItem('bids_' + u.email) || '[]').length; });
            document.getElementById('userCount').textContent = users.length;
            document.getElementById('listingCount').textContent = totalListings;
            document.getElementById('bidCount').textContent = totalBids;
        }
        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const html = users.map(u => { const listings = JSON.parse(localStorage.getItem('myListings_' + u.email) || '[]').length; return `<tr><td>${u.name}</td><td>${u.email}</td><td>${new Date(u.createdAt || '2026-01-01').toLocaleDateString('fr-FR')}</td><td>${listings}</td><td><button class="btn btn-danger" onclick="deleteUser('${u.email}')">Supprimer</button></td></tr>`; }).join('');
            document.getElementById('usersList').innerHTML = html;
        }
        function loadListings() {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            let allListings = [];
            users.forEach(u => { const listings = JSON.parse(localStorage.getItem('myListings_' + u.email) || '[]'); listings.forEach(l => { l.creator = u.name; allListings.push(l); }); });
            const html = allListings.map(l => `<tr><td>${l.title}</td><td>${l.creator}</td><td>€${l.price.toLocaleString('fr-FR')}</td><td>${new Date(l.createdAt).toLocaleDateString('fr-FR')}</td><td><button class="btn btn-danger" onclick="deleteListing('${l.id}')">Supprimer</button></td></tr>`).join('');
            document.getElementById('listingsList').innerHTML = html;
        }
        function deleteUser(email) { if (confirm('Supprimer cet utilisateur?')) { let users = JSON.parse(localStorage.getItem('users') || '[]'); users = users.filter(u => u.email !== email); localStorage.setItem('users', JSON.stringify(users)); localStorage.removeItem('myListings_' + email); location.reload(); } }
        function deleteListing(id) { alert('Suppression à implémenter'); }
        init();
    </script>
</body>
</html>
