<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcourir - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        h1 { font-size: 2rem; }
        .user-info {
            background: rgba(30, 41, 59, 0.8);
            padding: 12px 20px;
            border-radius: 6px;
            border: 1px solid rgba(71, 85, 105, 0.3);
        }
        .logout-btn {
            margin-left: 20px;
            padding: 8px 16px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover { background: #dc2626; }
        .listings {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .listing-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.3s, border-color 0.3s;
            cursor: pointer;
        }
        .listing-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
        }
        .listing-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .listing-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .listing-year { color: #94a3b8; font-size: 0.9rem; margin-bottom: 12px; }
        .listing-price { font-size: 1.5rem; font-weight: 700; color: #22c55e; margin-bottom: 15px; }
        .listing-status { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #86efac; padding: 8px 12px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 15px; display: inline-block; }
        .bid-btn { width: 100%; padding: 12px; background: #8b5cf6; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .bid-btn:hover { background: #7c3aed; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚗 Parcourir les enchères</h1>
        <div class="user-info">
            <span id="userName">Utilisateur</span>
            <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </div>
    </div>

    <div class="listings" id="listingsContainer"></div>

    <script>
        const SAMPLE_LISTINGS = [
            { id: 1, title: 'BMW M3 2018', year: 2018, price: 45000, emoji: '🏎️' },
            { id: 2, title: 'Mercedes C63 2020', year: 2020, price: 62000, emoji: '⚡' },
            { id: 3, title: 'Audi RS6 2019', year: 2019, price: 55000, emoji: '🔥' },
            { id: 4, title: 'Porsche 911 2017', year: 2017, price: 78000, emoji: '💎' },
            { id: 5, title: 'Tesla Model S 2021', year: 2021, price: 52000, emoji: '⚙️' },
            { id: 6, title: 'Range Rover 2019', year: 2019, price: 48000, emoji: '👑' }
        ];

        function init() {
            const currentUserStr = localStorage.getItem('currentUser');
            const currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
            if (!currentUser || !currentUser.name) window.location.href = 'index.html';
            else { document.getElementById('userName').textContent = currentUser.name; displayListings(); }
        }

        function displayListings() {
            const container = document.getElementById('listingsContainer');
            container.innerHTML = SAMPLE_LISTINGS.map(l => {
                return '<div class="listing-card" onclick="viewListing(' + l.id + ')">' +
                    '<div class="listing-image">' + l.emoji + '</div>' +
                    '<div class="listing-title">' + l.title + '</div>' +
                    '<div class="listing-year">Année: ' + l.year + '</div>' +
                    '<div class="listing-price">€' + l.price.toLocaleString('fr-FR') + '</div>' +
                    '<div class="listing-status">Enchère active</div>' +
                    '<button class="bid-btn" onclick="event.stopPropagation(); placeBid(' + l.id + ')">Faire une offre</button>' +
                    '</div>';
            }).join('');
        }

        function viewListing(id) {
            window.location.href = 'listing-detail.html?id=' + id;
        }

        function placeBid(id) {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const listing = SAMPLE_LISTINGS.find(l => l.id === id);
            const newBid = prompt('Votre offre pour ' + listing.title + '?\n(Minimum: €' + (listing.price + 1000) + ')', listing.price + 1000);

            if (!newBid) return;
            const bidAmount = parseInt(newBid);

            if (bidAmount <= listing.price) {
                alert('Votre offre doit être plus haute que le prix actuel');
                return;
            }

            alert('Offre de €' + bidAmount + ' placée pour ' + listing.title + '!\n\nAu meilleur compte pour: ' + currentUser.name);
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        init();
    </script>
</body>
</html>
