<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 400px; width: 100%; background: rgba(30, 41, 59, 0.95); border: 2px solid #10b981; border-radius: 12px; padding: 40px; }
        h1 { font-size: 1.8rem; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #e2e8f0; }
        input { width: 100%; padding: 14px; border: 2px solid #10b981; border-radius: 8px; background: white; color: #1e293b; font-size: 1rem; font-weight: 500; }
        input::placeholder { color: #94a3b8; }
        input:focus { outline: none; border-color: #34d399; background: #f0fdf4; }
        button { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 20px; }
        button:hover { background: #059669; }
        .message { padding: 12px; margin-bottom: 20px; border-radius: 6px; display: none; font-size: 0.9rem; font-weight: 600; }
        .error { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }
        .success { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Se connecter</h1>
        <div class="message" id="message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="jean@example.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••" required>
            </div>
            <button type="submit">Se connecter</button>
        </form>
        <div class="link">
            Pas de compte? <a href="signup.html">S'inscrire</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            if (!user) { showMessage('❌ Email ou mot de passe incorrect. Vérifiez et réessayez.', 'error'); return; }
            localStorage.setItem('currentUser', JSON.stringify(user));
            showMessage('✅ Connexion réussie! Redirection...', 'success');
            setTimeout(() => { window.location.href = 'browse.html'; }, 1500);
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
