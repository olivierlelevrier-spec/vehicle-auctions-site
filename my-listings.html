<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Annonces - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; padding: 20px; }
        .header { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { font-size: 2rem; }
        .btn { padding: 10px 20px; background: #22c55e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn:hover { background: #16a34a; }
        .btn-blue { background: #3b82f6; }
        .btn-blue:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .container { max-width: 1200px; margin: 0 auto; }
        .listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(71, 85, 105, 0.3); border-radius: 12px; padding: 20px; }
        .image { width: 100%; height: 200px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 15px; }
        .title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .price { font-size: 1.5rem; color: #22c55e; font-weight: 700; margin-bottom: 10px; }
        .specs { font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px; }
        .actions { display: flex; gap: 10px; }
        .actions button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .info-badge { display: inline-block; background: rgba(34, 197, 94, 0.2); color: #86efac; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚗 Mes Annonces</h1>
        <div>
            <a href="create-listing.html" class="btn">+ Créer Annonce</a>
            <a href="browse.html" class="btn btn-blue" style="margin-left: 10px;">← Retour</a>
        </div>
    </div>
    <div class="container">
        <div class="listings" id="list"></div>
        <div id="empty" class="empty" style="display:none"><p>Aucune annonce pour le moment</p></div>
    </div>
    <script>
        function init() {
            const currentUserStr = localStorage.getItem('currentUser');
            const currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
            if (!currentUser) { window.location.href = 'login.html'; return; }
            const myListings = JSON.parse(localStorage.getItem('myListings_' + currentUser.email) || '[]');
            if (myListings.length === 0) { document.getElementById('empty').style.display = 'block'; return; }
            const html = myListings.map(l => {
                const hasPhotos = l.photos && l.photos.length > 0;
                const hasCT = l.ct && l.ct.date;
                const hasCosts = (l.costs && (l.costs.done > 0 || l.costs.planned > 0));
                return `<div class="card">
                    <div class="image">${l.emoji}</div>
                    <div class="title">${l.title}</div>
                    <div class="specs">Année: ${l.year} | ${l.mileage} km</div>
                    ${hasPhotos ? '<span class="info-badge">📸 ' + l.photos.length + ' photos</span>' : ''}
                    ${hasCT ? '<span class="info-badge">🔧 CT</span>' : ''}
                    ${hasCosts ? '<span class="info-badge">💰 Frais</span>' : ''}
                    <div class="price">€${l.price.toLocaleString('fr-FR')}</div>
                    <div class="actions">
                        <button class="btn" onclick="viewListing(${l.id})">Voir</button>
                        <button class="btn btn-blue" onclick="editListing(${l.id})">Éditer</button>
                        <button class="btn btn-danger" onclick="deleteListing(${l.id})">Supprimer</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('list').innerHTML = html;
        }
        function deleteListing(id) {
            if (!confirm('Supprimer cette annonce?')) return;
            const currentUserStr = localStorage.getItem('currentUser');
            const currentUser = JSON.parse(currentUserStr);
            let myListings = JSON.parse(localStorage.getItem('myListings_' + currentUser.email) || '[]');
            myListings = myListings.filter(l => l.id !== id);
            localStorage.setItem('myListings_' + currentUser.email, JSON.stringify(myListings));
            location.reload();
        }
        function editListing(id) { alert('Édition à venir'); }
        function viewListing(id) { alert('Consultation à venir'); }
        init();
    </script>
</body>
</html>
