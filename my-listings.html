<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Annonces - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; padding: 20px; }
        .header { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { font-size: 2rem; }
        .btn { padding: 10px 20px; background: #22c55e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; }
        .btn:hover { background: #16a34a; }
        .btn-blue { background: #3b82f6; }
        .btn-blue:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .container { max-width: 1200px; margin: 0 auto; }
        .listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(71, 85, 105, 0.3); border-radius: 12px; padding: 20px; }
        .image { width: 100%; height: 200px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin-bottom: 15px; }
        .title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .price { font-size: 1.5rem; color: #22c55e; font-weight: 700; margin-bottom: 10px; }
        .specs { font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px; }
        .actions { display: flex; gap: 10px; }
        .actions button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .empty { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .info-badge { display: inline-block; background: rgba(34, 197, 94, 0.2); color: #86efac; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚗 Mes Annonces</h1>
        <div>
            <a href="create-listing.html" class="btn">+ Créer Annonce</a>
            <a href="browse.html" class="btn btn-blue" style="margin-left: 10px;">← Retour</a>
        </div>
    </div>
    <div class="container">
        <div class="listings" id="list"></div>
        <div id="empty" class="empty" style="display:none"><p>Aucune annonce pour le moment</p></div>
    </div>

    <!-- MODAL POUR VOIR/ÉDITER ANNONCE -->
    <div id="modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:1000; overflow-y:auto; padding:20px;">
        <div style="max-width:700px; margin:40px auto; background:rgba(30,41,59,0.95); border:2px solid #22c55e; border-radius:12px; padding:30px;">
            <h2 id="modalTitle">Voir Annonce</h2>
            <div id="modalContent"></div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn btn-blue" id="modalEditBtn" onclick="switchToEdit()" style="display:none;">✏️ Éditer</button>
                <button class="btn" onclick="closeModal()">Fermer</button>
            </div>
        </div>
    </div>
    <script>
        function init() {
            const currentUserStr = localStorage.getItem('currentUser');
            const currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
            if (!currentUser) { window.location.href = 'login.html'; return; }
            const myListings = JSON.parse(localStorage.getItem('myListings_' + currentUser.email) || '[]');
            if (myListings.length === 0) { document.getElementById('empty').style.display = 'block'; return; }
            const html = myListings.map(l => {
                const hasPhotos = l.photos && l.photos.length > 0;
                const hasCT = l.ct && l.ct.date;
                const hasCosts = (l.costs && (l.costs.done > 0 || l.costs.planned > 0));
                return `<div class="card">
                    <div class="image">${l.emoji}</div>
                    <div class="title">${l.title}</div>
                    <div class="specs">Année: ${l.year} | ${l.mileage} km</div>
                    ${hasPhotos ? '<span class="info-badge">📸 ' + l.photos.length + ' photos</span>' : ''}
                    ${hasCT ? '<span class="info-badge">🔧 CT</span>' : ''}
                    ${hasCosts ? '<span class="info-badge">💰 Frais</span>' : ''}
                    <div class="price">€${l.price.toLocaleString('fr-FR')}</div>
                    <div class="actions">
                        <button class="btn" onclick="viewListing(${l.id})">Voir</button>
                        <button class="btn btn-blue" onclick="editListing(${l.id})">Éditer</button>
                        <button class="btn btn-danger" onclick="deleteListing(${l.id})">Supprimer</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('list').innerHTML = html;
        }
        let currentListing = null;
        let isEditMode = false;

        function getListing(id) {
            const currentUserStr = localStorage.getItem('currentUser');
            const currentUser = JSON.parse(currentUserStr);
            const myListings = JSON.parse(localStorage.getItem('myListings_' + currentUser.email) || '[]');
            return myListings.find(l => l.id === id);
        }

        function viewListing(id) {
            currentListing = getListing(id);
            isEditMode = false;
            displayListing();
            document.getElementById('modalEditBtn').style.display = 'inline-block';
            document.getElementById('modal').style.display = 'block';
        }

        function editListing(id) {
            currentListing = getListing(id);
            isEditMode = true;
            displayListing();
            document.getElementById('modalEditBtn').style.display = 'none';
            document.getElementById('modal').style.display = 'block';
        }

        function displayListing() {
            const l = currentListing;
            if (!l) return;

            const content = isEditMode ? `
                <div style="margin:20px 0;">
                    <label>Titre *</label>
                    <input type="text" id="editTitle" value="${l.title}" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #22c55e; border-radius:6px; background:white; color:black;">

                    <label>Prix (EUR) *</label>
                    <input type="number" id="editPrice" value="${l.price}" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #22c55e; border-radius:6px; background:white; color:black;">

                    <label>Description *</label>
                    <textarea id="editDescription" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #22c55e; border-radius:6px; background:white; color:black; min-height:100px;">${l.description}</textarea>

                    <button class="btn" onclick="saveListing()" style="width:100%;">💾 Sauvegarder</button>
                </div>
            ` : `
                <div style="background:rgba(71,85,105,0.1); padding:15px; border-radius:8px; margin:15px 0;">
                    <p><strong>Titre:</strong> ${l.title}</p>
                    <p><strong>Prix:</strong> €${l.price.toLocaleString('fr-FR')}</p>
                    <p><strong>Année:</strong> ${l.year} | <strong>Kilométrage:</strong> ${l.mileage} km</p>
                    <p><strong>Description:</strong> ${l.description}</p>
                    ${l.photos && l.photos.length > 0 ? `<p><strong>Photos:</strong> ${l.photos.length} photo(s)</p>` : ''}
                    ${l.ct && l.ct.date ? `<p><strong>CT:</strong> ${l.ct.date} (${l.ct.validity || 'N/A'})</p>` : ''}
                    ${l.costs && (l.costs.done > 0 || l.costs.planned > 0) ? `<p><strong>Frais:</strong> Réalisés: €${l.costs.done}, Prévus: €${l.costs.planned}</p>` : ''}
                </div>
            `;

            document.getElementById('modalTitle').textContent = isEditMode ? 'Éditer Annonce' : 'Voir Annonce';
            document.getElementById('modalContent').innerHTML = content;
        }

        function saveListing() {
            const title = document.getElementById('editTitle').value.trim();
            const price = parseInt(document.getElementById('editPrice').value);
            const description = document.getElementById('editDescription').value.trim();

            if (!title || !price || !description) {
                alert('Remplissez les champs obligatoires');
                return;
            }

            const currentUserStr = localStorage.getItem('currentUser');
            const currentUser = JSON.parse(currentUserStr);
            let myListings = JSON.parse(localStorage.getItem('myListings_' + currentUser.email) || '[]');

            const idx = myListings.findIndex(l => l.id === currentListing.id);
            if (idx >= 0) {
                myListings[idx].title = title;
                myListings[idx].price = price;
                myListings[idx].description = description;
                localStorage.setItem('myListings_' + currentUser.email, JSON.stringify(myListings));
                alert('Annonce mise à jour!');
                location.reload();
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            currentListing = null;
            isEditMode = false;
        }

        function switchToEdit() {
            isEditMode = true;
            displayListing();
            document.getElementById('modalEditBtn').style.display = 'none';
        }

        function deleteListing(id) {
            if (!confirm('Supprimer cette annonce?')) return;
            const currentUserStr = localStorage.getItem('currentUser');
            const currentUser = JSON.parse(currentUserStr);
            let myListings = JSON.parse(localStorage.getItem('myListings_' + currentUser.email) || '[]');
            myListings = myListings.filter(l => l.id !== id);
            localStorage.setItem('myListings_' + currentUser.email, JSON.stringify(myListings));
            location.reload();
        }

        init();
    </script>
</body>
</html>
