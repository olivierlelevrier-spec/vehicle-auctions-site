<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyseur de Photos - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        h1 { font-size: 2rem; }
        .btn { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; }
        .btn:hover { background: #2563eb; }
        .upload-zone { background: rgba(30, 41, 59, 0.95); border: 3px dashed #22c55e; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 30px; }
        .upload-zone:hover { background: rgba(30, 41, 59, 0.99); border-color: #86efac; }
        .upload-zone.dragover { background: rgba(34, 197, 94, 0.1); border-color: #86efac; }
        .upload-icon { font-size: 3rem; margin-bottom: 15px; }
        .upload-text { color: #94a3b8; font-size: 1.1rem; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        .photos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .photo-card { background: rgba(30, 41, 59, 0.8); border-radius: 12px; overflow: hidden; }
        .photo-image { width: 100%; height: 200px; object-fit: cover; }
        .photo-info { padding: 15px; }
        .photo-name { font-weight: 600; margin-bottom: 10px; word-break: break-all; }
        .quality-bar { height: 8px; background: rgba(71, 85, 105, 0.3); border-radius: 4px; margin-bottom: 10px; overflow: hidden; }
        .quality-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .quality-good { background: #22c55e; }
        .quality-ok { background: #f59e0b; }
        .quality-bad { background: #ef4444; }
        .score { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .score-label { color: #94a3b8; font-size: 0.9rem; }
        .score-value { font-weight: 700; }
        .issues { color: #fca5a5; font-size: 0.85rem; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(239, 68, 68, 0.2); }
        .issue-item { margin: 5px 0; }
        .recommendation { background: rgba(34, 197, 94, 0.1); border-left: 4px solid #22c55e; padding: 12px; border-radius: 6px; margin-top: 10px; color: #86efac; font-size: 0.9rem; }
        .recommendation.warning { background: rgba(245, 158, 11, 0.1); border-left-color: #f59e0b; color: #fcd34d; }
        .empty { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Analyseur de Photos</h1>
            <a href="browse.html" class="btn">← Retour</a>
        </div>

        <div class="upload-zone" id="uploadZone" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📷</div>
            <div class="upload-text">Glissez vos photos ici ou cliquez pour en sélectionner</div>
            <div style="color: #64748b; font-size: 0.9rem;">Max 5 photos • JPG, PNG • Recommandé: 1200x800px minimum</div>
            <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(event)">
        </div>

        <div class="photos-grid" id="photosGrid"></div>
        <div id="empty" class="empty"><p>Aucune photo analysée</p></div>
    </div>

    <script>
        let analyzedPhotos = [];

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('uploadZone').classList.add('dragover');
        }

        function handleDragLeave(e) {
            document.getElementById('uploadZone').classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('uploadZone').classList.remove('dragover');
            handleFiles({ target: { files: e.dataTransfer.files } });
        }

        function handleFiles(event) {
            const files = Array.from(event.target.files).slice(0, 5);
            analyzedPhotos = [];
            document.getElementById('empty').style.display = analyzedPhotos.length === 0 ? 'block' : 'none';

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    analyzePhoto(file, e.target.result);
                };
                reader.readAsDataURL(file);
            });
        }

        function analyzePhoto(file, dataUrl) {
            const img = new Image();
            img.onload = () => {
                const analysis = performAnalysis(img, file);
                analyzedPhotos.push({ file, dataUrl, analysis });
                renderPhotos();
            };
            img.src = dataUrl;
        }

        function performAnalysis(img, file) {
            let score = 100;
            const issues = [];
            const recommendations = [];

            // Vérifier la taille
            const fileSizeMB = file.size / (1024 * 1024);
            if (fileSizeMB > 5) {
                issues.push('Fichier trop volumineux (compressez-le)');
                score -= 10;
            }
            if (fileSizeMB < 0.1) {
                issues.push('Fichier trop petit (qualité insuffisante)');
                score -= 15;
            }

            // Vérifier les dimensions
            const width = img.width;
            const height = img.height;
            if (width < 800 || height < 600) {
                issues.push(`Résolution trop faible (${width}x${height})`);
                score -= 20;
                recommendations.push('Utilisez des photos d\'au moins 1200x800px');
            }

            // Vérifier l'aspect ratio
            const ratio = width / height;
            if (ratio < 1 || ratio > 2.5) {
                issues.push('Aspect ratio non optimal');
                score -= 5;
            }

            // Analyser la luminosité via canvas
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            let brightness = 0;
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                brightness += (r + g + b) / 3;
            }
            brightness = brightness / (data.length / 4);

            if (brightness < 50) {
                issues.push('Photo trop sombre');
                score -= 25;
                recommendations.push('Prenez la photo dans un endroit mieux éclairé');
            } else if (brightness > 240) {
                issues.push('Photo surexposée');
                score -= 15;
                recommendations.push('Évitez la lumière directe du soleil');
            }

            // Estimateur de netteté simple (basé sur l'absence de gradient)
            const blurScore = estimateBlur(imageData);
            if (blurScore > 0.8) {
                issues.push('Photo semble floue');
                score -= 30;
                recommendations.push('Assurez-vous que la caméra est stable');
            }

            score = Math.max(0, Math.min(100, score));

            return {
                quality: score,
                size: fileSizeMB.toFixed(2),
                dimensions: `${width}x${height}`,
                brightness: Math.round(brightness),
                issues,
                recommendations
            };
        }

        function estimateBlur(imageData) {
            // Estimation simple du flou via la variance des gradients
            const data = imageData.data;
            const width = imageData.width;
            let variance = 0;
            let count = 0;

            for (let i = 0; i < data.length - 4; i += 4) {
                if (i % (width * 4) < (width - 1) * 4) {
                    const current = (data[i] + data[i+1] + data[i+2]) / 3;
                    const next = (data[i+4] + data[i+5] + data[i+6]) / 3;
                    variance += Math.abs(current - next);
                    count++;
                }
            }
            return (variance / count) > 20 ? 0.2 : 0.8; // Simple heuristic
        }

        function renderPhotos() {
            const grid = document.getElementById('photosGrid');
            document.getElementById('empty').style.display = analyzedPhotos.length === 0 ? 'block' : 'none';

            grid.innerHTML = analyzedPhotos.map((p, i) => {
                const a = p.analysis;
                const qualityClass = a.quality >= 80 ? 'quality-good' : a.quality >= 60 ? 'quality-ok' : 'quality-bad';
                const fillWidth = a.quality + '%';

                return `
                    <div class="photo-card">
                        <img src="${p.dataUrl}" class="photo-image" />
                        <div class="photo-info">
                            <div class="photo-name" title="${p.file.name}">${p.file.name.substring(0, 30)}</div>
                            <div class="quality-bar">
                                <div class="quality-fill ${qualityClass}" style="width: ${fillWidth}"></div>
                            </div>
                            <div class="score">
                                <span class="score-label">Score qualité</span>
                                <span class="score-value">${a.quality}/100</span>
                            </div>
                            <div class="score">
                                <span class="score-label">Dimensions</span>
                                <span class="score-value">${a.dimensions}</span>
                            </div>
                            <div class="score">
                                <span class="score-label">Taille</span>
                                <span class="score-value">${a.size}MB</span>
                            </div>
                            ${a.issues.length > 0 ? '<div class="issues">' + a.issues.map(i => '<div class="issue-item">⚠️ ' + i + '</div>').join('') + '</div>' : ''}
                            ${a.recommendations.length > 0 ? '<div class="recommendation' + (a.quality < 60 ? ' warning' : '') + '">' + a.recommendations[0] + '</div>' : '<div class="recommendation">✅ Photo de bonne qualité!</div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>

    <div class="link">
        <a href="create-listing.html">Utiliser dans une annonce →</a>
    </div>
</body>
</html>
