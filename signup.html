<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 400px; width: 100%; background: rgba(30, 41, 59, 0.95); border: 2px solid #3b82f6; border-radius: 12px; padding: 40px; }
        h1 { font-size: 1.8rem; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #e2e8f0; }
        input { width: 100%; padding: 14px; border: 2px solid #3b82f6; border-radius: 8px; background: white; color: #1e293b; font-size: 1rem; font-weight: 500; }
        input::placeholder { color: #94a3b8; }
        input:focus { outline: none; border-color: #60a5fa; background: #f0f9ff; }
        button { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 20px; }
        button:hover { background: #2563eb; }
        .message { padding: 12px; margin-bottom: 20px; border-radius: 6px; display: none; font-size: 0.9rem; font-weight: 600; }
        .success { background: #dcfce7; color: #166534; border: 2px solid #22c55e; }
        .error { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }
        .link { text-align: center; margin-top: 20px; }
        .link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 S'inscrire</h1>
        <div class="message" id="message"></div>
        <form id="signupForm">
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" id="name" placeholder="Jean Dupont" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="jean@example.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="Min. 6 caractères" required minlength="6">
            </div>
            <div class="form-group">
                <label>Confirmer</label>
                <input type="password" id="passwordConfirm" placeholder="Min. 6 caractères" required minlength="6">
            </div>
            <button type="submit">S'inscrire</button>
        </form>
        <div class="link">
            Déjà inscrit? <a href="login.html">Se connecter</a>
        </div>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            if (!name) { showMessage('❌ Nom requis!', 'error'); return; }
            if (!email.includes('@')) { showMessage('❌ Email invalide (besoin de @)', 'error'); return; }
            if (password.length < 6) { showMessage('❌ Mot de passe: min 6 caractères', 'error'); return; }
            if (password !== passwordConfirm) { showMessage('❌ Mots de passe ne correspondent pas', 'error'); return; }
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            if (users.some(u => u.email === email)) { showMessage('❌ Email existe déjà!', 'error'); return; }
            users.push({ name, email, password });
            localStorage.setItem('users', JSON.stringify(users));
            showMessage('✅ Inscription réussie! Redirection...', 'success');
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
