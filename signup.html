<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - VehicleAuctions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 12px;
            padding: 40px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #3b82f6;
            border-radius: 6px;
            background: white; color: black;
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #3b82f6; background: rgba(15, 23, 42, 0.8); }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
            font-size: 0.9rem;
        }
        .success { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #86efac; }
        .error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; }
        .link { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 0.9rem; }
        .link a { color: #60a5fa; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 S'inscrire</h1>
        <div class="message" id="message"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Nom complet *</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe (min. 6 caractères) *</label>
                <input type="password" id="password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="passwordConfirm">Confirmer mot de passe *</label>
                <input type="password" id="passwordConfirm" required minlength="6">
            </div>
            
            <button type="submit" id="submitBtn">S'inscrire</button>
        </form>
        
        <div class="link">
            Vous avez déjà un compte? <a href="login.html">Se connecter</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            
            // Validation
            if (!name) { showMessage('Le nom est requis', 'error'); return; }
            if (!email.includes('@')) { showMessage('Email invalide', 'error'); return; }
            if (password.length < 6) { showMessage('Min. 6 caractères', 'error'); return; }
            if (password !== passwordConfirm) { showMessage('Les mots de passe ne correspondent pas', 'error'); return; }
            
            // Vérifier email existant
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            if (users.some(u => u.email === email)) {
                showMessage('Cet email existe déjà', 'error');
                return;
            }
            
            // Créer utilisateur
            users.push({ name, email, password });
            localStorage.setItem('users', JSON.stringify(users));
            
            showMessage('✅ Inscription réussie! Redirection...', 'success');
            document.getElementById('submitBtn').disabled = true;
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
