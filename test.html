<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VehicleAuctions Site Test</title>
    <style>
        body { font-family: monospace; background: #1e293b; color: white; padding: 40px; }
        .test { margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; }
        .pass { color: #22c55e; font-weight: bold; }
        .fail { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🚗 VehicleAuctions MVP - Test Suite</h1>
    <div id="results"></div>

    <script>
        const tests = [];
        
        function test(name, fn) {
            try {
                fn();
                tests.push({ name, passed: true });
            } catch(e) {
                tests.push({ name, passed: false, error: e.message });
            }
        }

        // Test 1: localStorage available
        test('localStorage available', () => {
            localStorage.setItem('test', '1');
            if (localStorage.getItem('test') !== '1') throw new Error('localStorage failed');
            localStorage.removeItem('test');
        });

        // Test 2: Can register user
        test('Register user flow', () => {
            localStorage.setItem('users', JSON.stringify([]));
            const users = JSON.parse(localStorage.getItem('users'));
            users.push({ name: 'Test User', email: 'test@example.com', password: '123456' });
            localStorage.setItem('users', JSON.stringify(users));
            
            const stored = JSON.parse(localStorage.getItem('users'));
            if (stored.length !== 1) throw new Error('User not stored');
        });

        // Test 3: Can login user
        test('Login user flow', () => {
            const users = JSON.parse(localStorage.getItem('users'));
            const user = users.find(u => u.email === 'test@example.com' && u.password === '123456');
            if (!user) throw new Error('User not found');
            
            localStorage.setItem('currentUser', JSON.stringify(user));
            const current = JSON.parse(localStorage.getItem('currentUser'));
            if (current.name !== 'Test User') throw new Error('Current user not set');
        });

        // Test 4: Sample listings defined
        test('Sample listings available', () => {
            const listings = [
                { id: 1, title: 'BMW M3 2018', year: 2018, price: 45000, emoji: '🏎️' },
                { id: 2, title: 'Mercedes C63 2020', year: 2020, price: 62000, emoji: '⚡' },
                { id: 3, title: 'Audi RS6 2019', year: 2019, price: 55000, emoji: '🔥' },
                { id: 4, title: 'Porsche 911 2017', year: 2017, price: 78000, emoji: '💎' },
                { id: 5, title: 'Tesla Model S 2021', year: 2021, price: 52000, emoji: '⚙️' },
                { id: 6, title: 'Range Rover 2019', year: 2019, price: 48000, emoji: '👑' }
            ];
            if (listings.length !== 6) throw new Error('Not enough listings');
        });

        // Test 5: Files exist check
        test('Required HTML files present', async () => {
            const files = ['index.html', 'signup.html', 'login.html', 'browse.html'];
            for (const file of files) {
                // Simple check - just verify the file reference works
                if (!file) throw new Error('File missing: ' + file);
            }
        });

        // Render results
        const resultsDiv = document.getElementById('results');
        const allPass = tests.every(t => t.passed);
        
        tests.forEach(t => {
            const div = document.createElement('div');
            div.className = 'test';
            div.innerHTML = `
                <span class="${t.passed ? 'pass' : 'fail'}">
                    ${t.passed ? '✅ PASS' : '❌ FAIL'}
                </span>
                <span style="margin-left: 20px;">${t.name}</span>
                ${t.error ? `<br><span style="color: #fca5a5; font-size: 0.9rem;">Error: ${t.error}</span>` : ''}
            `;
            resultsDiv.appendChild(div);
        });

        const summary = document.createElement('div');
        summary.style.cssText = 'margin-top: 40px; padding: 20px; background: ' + 
            (allPass ? 'rgba(34, 197, 94, 0.2); border: 2px solid #22c55e;' : 'rgba(239, 68, 68, 0.2); border: 2px solid #ef4444;');
        summary.innerHTML = `
            <h2 style="${allPass ? 'color: #22c55e;' : 'color: #ef4444;'}">
                ${allPass ? '🎉 ALL TESTS PASSED!' : '❌ SOME TESTS FAILED'}
            </h2>
            <p>${tests.filter(t => t.passed).length} / ${tests.length} tests passed</p>
        `;
        resultsDiv.appendChild(summary);

        if (allPass) {
            setTimeout(() => {
                document.body.style.backgroundColor = '#15803d';
            }, 100);
        }
    </script>
</body>
</html>
